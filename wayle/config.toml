# Wayle shell configuration (Wayle 0.7 format)
# Pastel Catppuccin Macchiato/Mocha theme

[bar]
location = "top"
bg = "bg-surface"
background-opacity = 88
rounding = "sm"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["cpu", "ram", "network", "battery", "hyprsunset"]

[styling.palette]
bg = "#181825"
surface = "#1e1e2e"
elevated = "#313244"
fg = "#cdd6f4"
fg-muted = "#7f849c"
primary = "#f5c2e7"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#89dceb"

[modules.hyprland-workspaces]
active-color = "#f5c2e7"
occupied-color = "#cba6f7"
empty-color = "#7f849c"
container-bg-color = "#313244"
app-icons-show = true
display-mode = "label"

[modules.clock]
format = "%H:%M"
icon-bg-color = "#f5c2e7"
label-color = "#f5c2e7"
button-bg-color = "#313244"

[modules.cpu]
icon-bg-color = "#89dceb"
label-color = "#89dceb"
button-bg-color = "#313244"

[modules.ram]
icon-bg-color = "#a6e3a1"
label-color = "#a6e3a1"
button-bg-color = "#313244"

[modules.network]
icon-bg-color = "#f9e2af"
label-color = "#f9e2af"
button-bg-color = "#313244"
right-click = "kitty -e nmtui"

[modules.battery]
icon-bg-color = "#cba6f7"
label-color = "#cba6f7"
button-bg-color = "#313244"

[modules.hyprsunset]
temperature = 4000
icon-bg-color = "#fab387"
label-color = "#fab387"
button-bg-color = "#313244"
