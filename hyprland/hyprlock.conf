general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(1e1e2eff)
}

label {
    monitor =
    text = $TIME
    font_size = 64
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] ~/.config/hypr/scripts/namaz.py
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 1.0)
    position = 0, 50
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    fade_on_empty = true
    placeholder_text = Password...
    position = 0, -20
    halign = center
    valign = center
}
