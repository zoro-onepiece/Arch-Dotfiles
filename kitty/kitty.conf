background #181825
foreground #cdd6f4
selection_background #f5e0dc
selection_foreground #181825
cursor #f5e0dc
cursor_text_color #1e1e2e

# Normal colors
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de

# Bright colors
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Spacing fixes (agar ab bhi spaces zyada lagein toh in numbers ko adjust kar sakti hain)
modify_font cell_width 100%
modify_font cell_height 0px
background_opacity 0.5
dynamic_background_opacity yes

# Audio Bell Alert
enable_audio_bell yes
bell_path /usr/share/sounds/freedesktop/stereo/complete.oga
window_alert_on_bell yes

# Terminal Opacity Shortcuts
map ctrl+shift+bracketright set_background_opacity +0.05
map ctrl+shift+bracketleft  set_background_opacity -0.05
map ctrl+shift+1            set_background_opacity 1.0
map ctrl+shift+0            set_background_opacity default
